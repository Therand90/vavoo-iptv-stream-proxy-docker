name: Build upstream Docker image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - compose.yaml
      - patches/**
      - .github/workflows/build-image.yml
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - compose.yaml
      - patches/**
      - .github/workflows/build-image.yml
      - .github/scripts/**

permissions:
  contents: read

concurrency:
  group: vavoo-upstream-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      image: ${{ steps.upstream.outputs.image }}
      should_build: ${{ steps.decision.outputs.build }}
      weekly_refresh: ${{ steps.decision.outputs.weekly_refresh }}

    steps:
      - name: Check out Docker wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Resolve latest upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(git ls-remote https://github.com/Haehnchen/vavoo-iptv-stream-proxy.git refs/heads/main | awk '{print $1}')"
          if [[ -z "$upstream_sha" ]]; then
            echo "Unable to resolve the upstream main branch" >&2
            exit 1
          fi

          short_sha="${upstream_sha:0:12}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/vavoo-iptv-stream-proxy"

          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "local_image=vavoo-smoke:$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Decide whether a build is required
        id: decision
        shell: bash
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
        run: |
          set -euo pipefail

          weekly_refresh=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] \
             && [[ "$(date -u +%u)" == "7" ]] \
             && [[ "$(date -u +%H)" == "00" ]]; then
            weekly_refresh=true
          fi

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] \
             && [[ "$weekly_refresh" != "true" ]] \
             && docker buildx imagetools inspect --raw "${IMAGE}:upstream-${SHORT_SHA}" 2>/dev/null \
               | jq -e '
                   [.manifests[]? | select(.platform.os == "linux") | .platform.architecture]
                   | (index("amd64") != null and index("arm64") != null)
                 ' >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "weekly_refresh=false" >> "$GITHUB_OUTPUT"
            echo "The validated image for upstream ${SHORT_SHA} already exists."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "weekly_refresh=$weekly_refresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image locally
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.upstream.outputs.local_image }}
          build-args: |
            UPSTREAM_REPO=Haehnchen/vavoo-iptv-stream-proxy
            UPSTREAM_REF=${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.therand.upstream.repository=https://github.com/Haehnchen/vavoo-iptv-stream-proxy
            io.therand.upstream.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=vavoo-image
          cache-to: type=gha,mode=max,scope=vavoo-image

      - name: Verify patches and smoke-test linux/amd64
        if: steps.decision.outputs.build == 'true'
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.upstream.outputs.local_image }}
          EXPECTED_PLATFORM: linux/amd64
        run: bash .github/scripts/validate-image.sh

      - name: Write validation summary
        if: always()
        shell: bash
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
          SHOULD_BUILD: ${{ steps.decision.outputs.build }}
          WEEKLY_REFRESH: ${{ steps.decision.outputs.weekly_refresh }}
        run: |
          {
            echo "## VAVOO Docker validation"
            echo
            echo "- Upstream commit: \`${SHORT_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            if [[ "$SHOULD_BUILD" == "true" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "- Result: build and smoke tests requested; no image publication from pull requests"
            elif [[ "$SHOULD_BUILD" == "true" && "$WEEKLY_REFRESH" == "true" ]]; then
              echo "- Result: weekly base-image refresh and smoke tests requested"
            elif [[ "$SHOULD_BUILD" == "true" ]]; then
              echo "- Result: build and smoke tests requested"
            else
              echo "- Result: existing validated image reused"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate_arm64:
    name: Build and validate ARM64 image
    needs: validate
    if: needs.validate.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Check out Docker wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ARM64 image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: vavoo-smoke:${{ needs.validate.outputs.short_sha }}
          build-args: |
            UPSTREAM_REPO=Haehnchen/vavoo-iptv-stream-proxy
            UPSTREAM_REF=${{ needs.validate.outputs.upstream_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.therand.upstream.repository=https://github.com/Haehnchen/vavoo-iptv-stream-proxy
            io.therand.upstream.revision=${{ needs.validate.outputs.upstream_sha }}
          cache-from: type=gha,scope=vavoo-image-arm64
          cache-to: type=gha,mode=max,scope=vavoo-image-arm64

      - name: Verify patches and smoke-test linux/arm64
        shell: bash
        env:
          LOCAL_IMAGE: vavoo-smoke:${{ needs.validate.outputs.short_sha }}
          EXPECTED_PLATFORM: linux/arm64
        run: bash .github/scripts/validate-image.sh

  publish:
    name: Publish image with attestations
    needs: [validate, validate_arm64]
    if: needs.validate.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out Docker wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for multi-architecture publication
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish validated image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.validate.outputs.image }}:upstream-${{ needs.validate.outputs.short_sha }}
            ${{ needs.validate.outputs.image }}:latest
          build-args: |
            UPSTREAM_REPO=Haehnchen/vavoo-iptv-stream-proxy
            UPSTREAM_REF=${{ needs.validate.outputs.upstream_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.therand.upstream.repository=https://github.com/Haehnchen/vavoo-iptv-stream-proxy
            io.therand.upstream.revision=${{ needs.validate.outputs.upstream_sha }}
          cache-from: |
            type=gha,scope=vavoo-image
            type=gha,scope=vavoo-image-arm64
          provenance: mode=max
          sbom: true

      - name: Verify the published tags include both architectures
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
        run: |
          set -euo pipefail
          for tag in latest "upstream-${SHORT_SHA}"; do
            docker buildx imagetools inspect --raw "${IMAGE}:${tag}" |
              jq -e '
                [.manifests[]? | select(.platform.os == "linux") | .platform.architecture]
                | (index("amd64") != null and index("arm64") != null)
              ' >/dev/null
            echo "Both linux/amd64 and linux/arm64 found in ${IMAGE}:${tag}"
          done

      # Do not prune GHCR versions here. Multi-platform indexes, image manifests,
      # and provenance/SBOM attestations are separate linked objects; removing
      # arbitrary package versions can break still-published image tags.

      - name: Write publication summary
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "## VAVOO Docker publication"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Upstream tag: \`upstream-${SHORT_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Provenance: max"
            echo "- SBOM: attached"
          } >> "$GITHUB_STEP_SUMMARY"
