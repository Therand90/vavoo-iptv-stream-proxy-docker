name: Build upstream Docker image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - compose.yaml
      - patches/**
      - .github/workflows/build-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - compose.yaml
      - patches/**
      - .github/workflows/build-image.yml

permissions:
  contents: read

concurrency:
  group: vavoo-upstream-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      image: ${{ steps.upstream.outputs.image }}
      should_build: ${{ steps.decision.outputs.build }}
      weekly_refresh: ${{ steps.decision.outputs.weekly_refresh }}

    steps:
      - name: Check out Docker wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Resolve latest upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(git ls-remote https://github.com/Haehnchen/vavoo-iptv-stream-proxy.git refs/heads/main | awk '{print $1}')"
          if [[ -z "$upstream_sha" ]]; then
            echo "Unable to resolve the upstream main branch" >&2
            exit 1
          fi

          short_sha="${upstream_sha:0:12}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/vavoo-iptv-stream-proxy"

          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "local_image=vavoo-smoke:$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Decide whether a build is required
        id: decision
        shell: bash
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
        run: |
          set -euo pipefail

          weekly_refresh=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] \
             && [[ "$(date -u +%u)" == "7" ]] \
             && [[ "$(date -u +%H)" == "00" ]]; then
            weekly_refresh=true
          fi

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] \
             && [[ "$weekly_refresh" != "true" ]] \
             && docker buildx imagetools inspect "${IMAGE}:upstream-${SHORT_SHA}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "weekly_refresh=false" >> "$GITHUB_OUTPUT"
            echo "The validated image for upstream ${SHORT_SHA} already exists."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "weekly_refresh=$weekly_refresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image locally
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.upstream.outputs.local_image }}
          build-args: |
            UPSTREAM_REPO=Haehnchen/vavoo-iptv-stream-proxy
            UPSTREAM_REF=${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.therand.upstream.repository=https://github.com/Haehnchen/vavoo-iptv-stream-proxy
            io.therand.upstream.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha,scope=vavoo-image
          cache-to: type=gha,mode=max,scope=vavoo-image

      - name: Verify local playback patches
        if: steps.decision.outputs.build == 'true'
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.upstream.outputs.local_image }}
        run: |
          set -euo pipefail

          docker run --rm --entrypoint node "$LOCAL_IMAGE" -e '
            const fs = require("node:fs");
            const source = fs.readFileSync("/app/index.js", "utf8");
            const required = [
              "CHANNELS_CACHE_TTL_SECONDS",
              "STREAM_URL_TTL_SECONDS",
              "VAVOO_PLAYLIST_CACHE_TTL_SECONDS",
              "VAVOO_HLS_ASSET_CACHE_TTL_SECONDS",
              "VAVOO_HLS_ASSET_MAX_CACHE_BYTES",
              "VAVOO_HLS_PREFETCH_SEGMENT_COUNT",
              "HLS_PROXY_SECRET",
              "invalid hls proxy signature",
              "/hls-channel/:id",
              "renewable hls master",
              "Buffer.from(await upstream.arrayBuffer())",
              "removeListener(",
              "onSocketClose",
              "/channels-grouped.m3u8",
              "/hls-group/:id",
              "logical loop confirmed",
              "logical timeline discontinuity",
              "lastSourceFirst"
            ];
            for (const marker of required) {
              if (!source.includes(marker)) {
                console.error(`missing patch marker: ${marker}`);
                process.exit(1);
              }
            }
            if (source.includes("cache.set(CHANNELS_CACHE_KEY, channels, 300);")) {
              process.exit(1);
            }
          '

          catalog_ttl="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_CHANNELS_CACHE_TTL_SECONDS"')"
          stream_ttl="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_STREAM_URL_TTL_SECONDS"')"
          playlist_ttl="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_PLAYLIST_CACHE_TTL_SECONDS"')"
          asset_ttl="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_HLS_ASSET_CACHE_TTL_SECONDS"')"
          asset_max="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_HLS_ASSET_MAX_CACHE_BYTES"')"
          prefetch_count="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_HLS_PREFETCH_SEGMENT_COUNT"')"
          loop_enabled="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_LOOP_DETECTION_ENABLED"')"
          loop_threshold="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_LOOP_SIMILARITY_THRESHOLD"')"
          loop_confirmations="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_LOOP_CONFIRMATIONS"')"
          loop_quarantine="$(docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c 'printf %s "$VAVOO_LOOP_QUARANTINE_SECONDS"')"

          test "$catalog_ttl" = "21600"
          test "$stream_ttl" = "3000"
          test "$playlist_ttl" = "300"
          test "$asset_ttl" = "120"
          test "$asset_max" = "12582912"
          test "$prefetch_count" = "2"
          test "$loop_enabled" = "true"
          test "$loop_threshold" = "0.70"
          test "$loop_confirmations" = "2"
          test "$loop_quarantine" = "86400"

      - name: Smoke-test catalog and renewable HLS entry point
        if: steps.decision.outputs.build == 'true'
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.upstream.outputs.local_image }}
        run: |
          set -euo pipefail

          container="vavoo-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:18888:8888 \
            "$LOCAL_IMAGE" >/dev/null

          ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18888/countries \
              --output /tmp/vavoo-countries.json \
              && grep --quiet '"France"' /tmp/vavoo-countries.json; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "The catalog did not become ready." >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

          unsigned_status="$(curl --silent --show-error \
            --output /tmp/vavoo-unsigned-proxy.txt \
            --write-out '%{http_code}' \
            --get \
            --data-urlencode 'url=https://example.com/test.m3u8' \
            http://127.0.0.1:18888/hls-proxy)"
          test "$unsigned_status" = "403"
          grep --quiet 'invalid hls proxy signature' /tmp/vavoo-unsigned-proxy.txt

          curl --fail --silent --show-error \
            "http://127.0.0.1:18888/channels.m3u8?country=France" \
            --output /tmp/vavoo-france.m3u8

          grep --quiet '^#EXTM3U' /tmp/vavoo-france.m3u8
          grep --quiet '^#EXTINF' /tmp/vavoo-france.m3u8
          grep --quiet '/stream/' /tmp/vavoo-france.m3u8

          curl --fail --silent --show-error \
            "http://127.0.0.1:18888/channels-grouped.m3u8?country=France" \
            --output /tmp/vavoo-france-grouped.m3u8

          grep --quiet '^#EXTM3U' /tmp/vavoo-france-grouped.m3u8
          grep --quiet '^#EXTINF' /tmp/vavoo-france-grouped.m3u8
          grep --quiet '/stream-group/' /tmp/vavoo-france-grouped.m3u8

          raw_count="$(grep -c '^#EXTINF:' /tmp/vavoo-france.m3u8)"
          grouped_count="$(grep -c '^#EXTINF:' /tmp/vavoo-france-grouped.m3u8)"
          test "$grouped_count" -gt 0
          test "$grouped_count" -le "$raw_count"

          curl --fail --silent --show-error \
            "http://127.0.0.1:18888/channel-groups?country=France" \
            --output /tmp/vavoo-france-groups.json
          grep --quiet '"variant_count"' /tmp/vavoo-france-groups.json

          stream_url="$(awk '/\/stream\// { print; exit }' /tmp/vavoo-france.m3u8)"
          stream_url="${stream_url%%|*}"
          test -n "$stream_url"

          curl --fail --silent --show-error \
            --user-agent 'VAVOO/2.6' \
            "$stream_url" \
            --output /tmp/vavoo-master.m3u8

          grep --quiet '^#EXTM3U' /tmp/vavoo-master.m3u8
          grep --quiet '/hls-channel/' /tmp/vavoo-master.m3u8

          logical_stream_url="$(awk '/\/stream-group\// { print; exit }' /tmp/vavoo-france-grouped.m3u8)"
          test -n "$logical_stream_url"
          curl --fail --silent --show-error \
            --user-agent 'VAVOO/2.6' \
            "$logical_stream_url" \
            --output /tmp/vavoo-logical-master.m3u8
          grep --quiet '^#EXTM3U' /tmp/vavoo-logical-master.m3u8
          grep --quiet '/hls-group/' /tmp/vavoo-logical-master.m3u8

      - name: Write validation summary
        if: always()
        shell: bash
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
          SHOULD_BUILD: ${{ steps.decision.outputs.build }}
          WEEKLY_REFRESH: ${{ steps.decision.outputs.weekly_refresh }}
        run: |
          {
            echo "## VAVOO Docker validation"
            echo
            echo "- Upstream commit: \`${SHORT_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            if [[ "$SHOULD_BUILD" == "true" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "- Result: build and smoke tests requested; no image publication from pull requests"
            elif [[ "$SHOULD_BUILD" == "true" && "$WEEKLY_REFRESH" == "true" ]]; then
              echo "- Result: weekly base-image refresh and smoke tests requested"
            elif [[ "$SHOULD_BUILD" == "true" ]]; then
              echo "- Result: build and smoke tests requested"
            else
              echo "- Result: existing validated image reused"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish image with attestations
    needs: validate
    if: needs.validate.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out Docker wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Publish validated image
        id: publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ needs.validate.outputs.image }}:upstream-${{ needs.validate.outputs.short_sha }}
            ${{ needs.validate.outputs.image }}:latest
          build-args: |
            UPSTREAM_REPO=Haehnchen/vavoo-iptv-stream-proxy
            UPSTREAM_REF=${{ needs.validate.outputs.upstream_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.therand.upstream.repository=https://github.com/Haehnchen/vavoo-iptv-stream-proxy
            io.therand.upstream.revision=${{ needs.validate.outputs.upstream_sha }}
          cache-from: type=gha,scope=vavoo-image
          provenance: mode=max
          sbom: true

      - name: Write publication summary
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "## VAVOO Docker publication"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Upstream tag: \`upstream-${SHORT_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Provenance: max"
            echo "- SBOM: attached"
          } >> "$GITHUB_STEP_SUMMARY"
